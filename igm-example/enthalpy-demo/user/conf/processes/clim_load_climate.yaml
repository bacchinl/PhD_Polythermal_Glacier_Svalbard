update_freq: 1
# Help : Update the climate fields and thus the mass balance each X years (1 by default)

adiabatic_lapse_rate: 0.00505
# Help : Adiabatic lapse rate for air temperature (in °C m-1). If value is positive, temperature decreases with increasing altitude.

air_temperature_stdev: 3.978
# Help : The space-independent standard deviation of the daily temperature variability (in Kelvin).

precipitation_lapse_rate: -0.6458
# Help : Change in precipitation with altitude (in % / 100m): that is, in % / 100m of the mean precipitation value in input field.
#        if value is positive, precipitation increases with increasing altitude.
#        if value is negative, precipitation decreases with increasing altitude.

min_precipitation_allowed: 1.0
# Help : Minimum allowed precipitation (mm yr-1) to avoid unrealistically low (e.g. negative) values

cosine_yearly_cycle_temp: True
# Help : Keep the temperature constant through the year (False), or make an ideal seasonal sinusoidal signal of temperature (True)

southern_hemisphere_climate: False
# Help : Set to True to switch to Southern Hemisphere hydrological year (May - April cycle) and optional seasonal cycle (warmest temperatures in January).

export_climate_ref: True
# Help : Set to True to export a NetCDF file called climate_ref.nc which allows to view the climate fields produced from input data and
#        user-define climate parameters (prior to updating climate due to changing ice surface elevation as simulation is running).

time_dependent_climate: True
# Help : Keep climate constant through simulation (False), or make it change during simulation (True) and thus use the user-defined climate_change_array

climate_change_array:
  - ["time", "temperature_offset", "precip_offset"]
  - [ 0, -2.336235356791914, 115.55065411775004]
  - [ 13000, -2.336235356791914, 115.55065411775004]

ela: 550 ## for enthalpy example

T_over_ela: 0
  
# Help : Time-dependent parameters for temperature offsets (in °C of change) and precipitation offsets
#        (in % of the original precipitation field, i.e. 100 means no change, 110 means +10% precipitation, etc).
#        Array structure: [time, temperature_offset, precip_offset]

