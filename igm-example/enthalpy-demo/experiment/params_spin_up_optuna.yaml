# @package _global_

# Run with:
#   igm_run -m +experiment=params_spin_up_obtuna \
#           hydra/sweeper=igm_optuna \
#           hydra.sweeper.optuna_config=optuna_ragna_CTS.yaml
# Or without Optuna (single run): igm_run +experiment=params_spin_up_optuna


defaults:
  - /user/conf/outputs@outputs.my_local: my_local
    #- /user/conf/processes@processes.clim_spin_up: clim_spin_up
  - /user/conf/processes@processes.clim_load_climate: clim_load_climate 
  - /user/conf/processes@processes: #.track_CTS_err: 
    - track_CTS_err

  - override /inputs: 
    - local
  - override /processes:
    - track_CTS_err
    - clim_load_climate
    - iceflow
    - time
    - enthalpy
    - subglacial_hydrology
  - override /outputs: 
    - my_local
      #- live_dashboard


  # - override /hydra/launcher: joblib # no error but does not seem to work compared to if you call it on the command line...
  # experiment: params # can we make it work here?

  # How to override help:
  # - hydra/help: my_app_help
  # - override hydra/help: my_app_help

inputs:
  local:
     type: netcdf
       #filename: input_Ragna-Mariebreen.nc
     filename: input_Dronbreen.nc
     coarsening:
       ratio: 3
     
     
processes:
  clim_load_climate:
    time_dependent_climate: False
    export_climate_ref: False
    #spin_up_year: 2023
    ela: 685
  track_CTS_err:
    glacier_name: "dronbreen"
    year_obs: 2022

  iceflow:
    physics:
      viscosity:
        arrhenius: 78.0         # Flow law coefficient (MPa^{-3} y^{-1}), 78 for temperate (0 °C), 11 for -10°C and for 4 for -20°C
      sliding:
        tau_ref: 0.325 # basal shear stress (MPa) required to ..
        u_ref: 500.0   # ... achieve u_ref basal sliding speed (m/yr)
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal: q1
      vert_spacing: 4.0
    emulator:
      retrain_freq: 1

  enthalpy:
    numerics:
      Nz: 30
    thermal:
      basal_heat_flux_ref: 0.040  
    surface:
      T_offset: 0.0
  subglacial_hydrology:
    mode: till_storage
    till_storage:
      h_water_till_max: 2.0      # m — till capacity
      drainage_rate: 0.001       # m/yr — basal drainage
      N_ref: 1.0e-3              # MPa
      e_ref: 0.69
      C_c: 0.12
      delta: 0.02


  time:
    start: 1600.0
    end: 2022.0
    save: 400.0
    

outputs:
  my_local:
    write_ts: False

